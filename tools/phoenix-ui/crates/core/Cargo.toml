[package]
name = "impeccable-core"
version.workspace = true
edition = "2021"
# The rule logic: the check functions and their heuristics.
license.workspace = true
publish.workspace = true

[features]
default = []
# The table-driven fake DOM for browser-rule tests (crates/wasm tests use it).
fake-dom = ["impeccable-foundation/fake-dom"]

[dependencies]
impeccable-foundation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
regex = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
impeccable-core = { path = ".", features = ["fake-dom"] }
