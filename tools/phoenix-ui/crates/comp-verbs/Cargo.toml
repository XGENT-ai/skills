[package]
name = "impeccable-comp-verbs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The comp-fidelity verb orchestrators (build-phase / comp-diff / comp-spec /
# font-match), ported from the skill's JS scripts. It wires the pure `comp`
# foundation plus `common` (Io), and `context` for one thing: build-phase reads
# the human plan and asset review (docs/PLAN-REVIEW.md) before page work.
# font-match's headless browser rendering of font specimens is injected as a
# `FontRenderer` trait the CLI implements over `crates/browser`.

[dependencies]
impeccable-comp = { workspace = true }
impeccable-common = { workspace = true }
# build-phase's organic-clip-path veto runs the detector's CSS scanner.
impeccable-core = { workspace = true }
# The plates -> hero gate reads the human plan review (component_review::plan::gate).
impeccable-context = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
regex = { workspace = true }
once_cell = { workspace = true }
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
