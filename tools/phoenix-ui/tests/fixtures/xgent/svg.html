<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline SVG</title>
<style>
  body { margin: 0; padding: 24px; font-family: Arial, sans-serif; }
  svg { display: inline-block; vertical-align: middle; }
  button { width: 40px; height: 40px; }
</style>
</head>
<body>
  <svg width="24" height="24" viewBox="0 0 24 24"><path d="M0 0h24v24H0z"/></svg>
  <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z"/></svg>
  <svg width="24" height="24" viewBox="0 0 24 24" aria-label="Logo"><path d="M0 0h24v24H0z"/></svg>
  <button type="button"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M0 0h20v20H0z"/></svg></button>
</body>
</html>
