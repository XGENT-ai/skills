<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>紧行</title>
<style>
  body { margin: 0; padding: 24px; font-family: sans-serif; font-size: 16px; }
  p { width: 30em; line-height: 1.4; }
</style>
</head>
<body>
  <p>过去的行高与行长检查只按拉丁文字的习惯判断，一段中文正文即使排得又密又长，也常常不会得到任何提示。汉字是方块字，每个字都占满一个字宽，同样的行高放在英文里显得疏朗，放在中文里却会让上下两行贴在一起；同样的栏宽，英文读起来刚好，中文一行却塞进了五十多个字，读者读到行尾再折回来时很容易找错行。这次更新让以汉字为主的正文改由</p>
</body>
</html>
