<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Font families</title>
<style>
  body { margin: 0; padding: 24px; }
  .a { font-family: Inter, sans-serif; }
  .b { font-family: Georgia, serif; }
  .c { font-family: "Playfair Display", serif; }
  .d { font-family: Verdana, sans-serif; }
</style>
</head>
<body>
  <p class="a">Body copy</p>
  <p class="b">Serif copy</p>
  <h1 class="c">Display</h1>
  <p class="d">Verdana copy</p>
</body>
</html>
