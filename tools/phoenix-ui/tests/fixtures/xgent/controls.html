<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Controls</title>
<style>
  body { margin: 0; padding: 24px; font-family: Arial, sans-serif; }
  .row { display: flex; align-items: center; gap: 8px; }
  .field { width: 240px; height: 40px; box-sizing: border-box; }
  .primary { height: 48px; padding: 0 20px; box-sizing: border-box; }
</style>
</head>
<body>
  <label for="query">Search</label>
  <div class="row">
    <input id="query" class="field" type="text" placeholder="Search">
    <button class="primary" type="button">Search</button>
  </div>
</body>
</html>
