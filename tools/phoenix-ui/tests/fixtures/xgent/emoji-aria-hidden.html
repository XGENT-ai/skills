<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emoji icons hidden from the accessibility tree</title>
<style>
  body { margin: 0; padding: 24px; font-family: Arial, sans-serif; }
  .icon { font-size: 24px; line-height: 1; }
</style>
</head>
<body>
  <div class="icon" aria-hidden="true">🚀</div>
  <h2>Fast deploys</h2>
  <div class="icon" aria-hidden="true">⚡</div>
  <h2>Instant builds</h2>
</body>
</html>
