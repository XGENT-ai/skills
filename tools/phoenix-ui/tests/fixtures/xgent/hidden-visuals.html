<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visually hidden chrome and emoji</title>
<style>
  body { margin: 0; padding: 24px; font-family: Arial, sans-serif; }
  .window { width: 360px; border-radius: 8px; background: #1e1e1e; padding: 10px 12px; }
  .bar { display: none; }
  .dot { display: block; width: 12px; height: 12px; border-radius: 50%; }
  .red { background: #ff5f57; }
  .amber { background: #febc2e; }
  .green { background: #28c840; }
  .icon { display: none; font-size: 24px; line-height: 1; }
</style>
</head>
<body>
  <div class="window">
    <div class="bar">
      <span class="dot red"></span>
      <span class="dot amber"></span>
      <span class="dot green"></span>
    </div>
  </div>
  <div class="icon">🚀</div>
  <h2>Fast deploys</h2>
  <div class="icon">⚡</div>
  <h2>Instant builds</h2>
</body>
</html>
