<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Window chrome in oklch</title>
<style>
  body { margin: 0; padding: 24px; font-family: Arial, sans-serif; }
  .window { width: 360px; border-radius: 8px; background: #1e1e1e; padding: 10px 12px; }
  .bar { display: flex; align-items: center; gap: 8px; }
  .dot { display: block; width: 12px; height: 12px; border-radius: 50%; }
  .red { background: oklch(0.637 0.237 25.331); }
  .amber { background: oklch(0.769 0.188 70.08); }
  .green { background: oklch(0.723 0.219 149.579); }
  .caption { margin: 10px 0 0; color: #eeeeee; font: inherit; }
</style>
</head>
<body>
  <div class="window">
    <div class="bar">
      <span class="dot red"></span>
      <span class="dot amber"></span>
      <span class="dot green"></span>
    </div>
    <p class="caption">Window preview</p>
  </div>
</body>
</html>
