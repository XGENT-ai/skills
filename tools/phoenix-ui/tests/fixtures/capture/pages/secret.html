<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Echo</title></head>
<body>
  <label>Secret <input id="secret"></label>
  <p id="echo">nothing typed yet</p>
  <script>
    // Echo the value everywhere a capture report could pick it up.
    document.getElementById('secret').addEventListener('input', (event) => {
      const value = event.target.value;
      console.error('echo ' + value);
      document.getElementById('echo').textContent = 'you typed ' + value;
      history.replaceState(null, '', '?token=' + encodeURIComponent(value));
    });
  </script>
</body>
</html>
