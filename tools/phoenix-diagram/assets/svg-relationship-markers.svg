<defs>
<!-- Crow's-foot cardinality: the foot opens toward the entity it describes; start markers are mirrored. -->
<marker id="er-one-start" markerWidth="24" markerHeight="18" refX="0" refY="8" orient="auto" markerUnits="userSpaceOnUse" class="a-default" style="stroke: var(--text-muted)" stroke-width="1.75"><path d="M 5 1 L 5 15"/></marker>
<marker id="er-one-end" markerWidth="24" markerHeight="18" refX="22" refY="8" orient="auto" markerUnits="userSpaceOnUse" class="a-default" style="stroke: var(--text-muted)" stroke-width="1.75"><path d="M 17 1 L 17 15"/></marker>
<marker id="er-one-optional-start" markerWidth="24" markerHeight="18" refX="0" refY="8" orient="auto" markerUnits="userSpaceOnUse" class="a-default" style="stroke: var(--text-muted)" stroke-width="1.75"><path d="M 5 1 L 5 15"/><circle cx="18.5" cy="8" r="2.6" class="c-mask"/><circle cx="18.5" cy="8" r="2.6"/></marker>
<marker id="er-one-optional-end" markerWidth="24" markerHeight="18" refX="22" refY="8" orient="auto" markerUnits="userSpaceOnUse" class="a-default" style="stroke: var(--text-muted)" stroke-width="1.75"><path d="M 17 1 L 17 15"/><circle cx="3.5" cy="8" r="2.6" class="c-mask"/><circle cx="3.5" cy="8" r="2.6"/></marker>
<marker id="er-many-start" markerWidth="24" markerHeight="18" refX="0" refY="8" orient="auto" markerUnits="userSpaceOnUse" class="a-default" style="stroke: var(--text-muted)" stroke-width="1.75"><path d="M 14 8 L 0 1 M 14 8 L 0 8 M 14 8 L 0 15"/></marker>
<marker id="er-many-end" markerWidth="24" markerHeight="18" refX="22" refY="8" orient="auto" markerUnits="userSpaceOnUse" class="a-default" style="stroke: var(--text-muted)" stroke-width="1.75"><path d="M 8 8 L 22 1 M 8 8 L 22 8 M 8 8 L 22 15"/></marker>
<marker id="er-many-optional-start" markerWidth="24" markerHeight="18" refX="0" refY="8" orient="auto" markerUnits="userSpaceOnUse" class="a-default" style="stroke: var(--text-muted)" stroke-width="1.75"><path d="M 14 8 L 0 1 M 14 8 L 0 8 M 14 8 L 0 15"/><circle cx="18.5" cy="8" r="2.6" class="c-mask"/><circle cx="18.5" cy="8" r="2.6"/></marker>
