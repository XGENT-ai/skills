<!-- UML relationship ends: the path end sits on the type border at refX, so a tip or a diamond point touches the type it describes. -->
<marker id="cl-open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" class="cl-marker" stroke-width="1.5" stroke-linejoin="round"><path d="M 1 1 L 11 6 L 1 11" fill="none"/></marker>
<marker id="cl-triangle" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse" class="cl-marker" stroke-width="1.5" stroke-linejoin="round"><path d="M 1 1.5 L 15 8 L 1 14.5 Z" class="cl-marker-hollow"/></marker>
<marker id="cl-diamond-filled" markerWidth="20" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse" class="cl-marker" stroke-width="1.5" stroke-linejoin="round"><path d="M 1 6 L 10 1 L 19 6 L 10 11 Z" class="cl-marker-filled"/></marker>
<marker id="cl-diamond-hollow" markerWidth="20" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse" class="cl-marker" stroke-width="1.5" stroke-linejoin="round"><path d="M 1 6 L 10 1 L 19 6 L 10 11 Z" class="cl-marker-hollow"/></marker>
<marker id="cl-triangle-start" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse" class="cl-marker" stroke-width="1.5" stroke-linejoin="round"><path d="M 1 1.5 L 15 8 L 1 14.5 Z" class="cl-marker-hollow"/></marker>
</defs>
