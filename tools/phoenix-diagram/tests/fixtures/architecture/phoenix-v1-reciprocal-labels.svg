<svg viewBox="0 0 550 202" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="classic" data-quality-profile="showcase" data-node-ui="" data-reader-fit="intrinsic-height" data-reader-min-text="7.5" data-reader-primary-text="14">
        <title id="archify-diagram-title">Payment interaction</title>
        <desc id="archify-diagram-description">An architecture diagram generated by Archify.</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>
        <style>
          svg[data-node-ui] [data-node-id] > rect:not(.c-mask) { stroke-width: 1.25px; }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-frontend { fill: color-mix(in srgb, var(--frontend-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--frontend-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-backend { fill: color-mix(in srgb, var(--backend-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--backend-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-database { fill: color-mix(in srgb, var(--database-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--database-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-cloud { fill: color-mix(in srgb, var(--cloud-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--cloud-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-security { fill: color-mix(in srgb, var(--security-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--security-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-messagebus { fill: color-mix(in srgb, var(--messagebus-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--messagebus-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-external { fill: color-mix(in srgb, var(--external-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--external-stroke) 72%, var(--mask)); }
          svg[data-node-ui]:is([data-preset="classic"], [data-preset="signal-flow"], [data-preset="editorial"]) .c-region { fill: color-mix(in srgb, var(--cloud-stroke) 3%, transparent); stroke: color-mix(in srgb, var(--cloud-stroke) 42%, var(--lane-stroke)); stroke-dasharray: none; }
          svg[data-node-ui] .c-security-group { stroke: color-mix(in srgb, var(--security-stroke) 58%, var(--lane-stroke)); }
          svg[data-node-ui]:is([data-preset="classic"], [data-preset="signal-flow"], [data-preset="editorial"]) .c-security-group { stroke-dasharray: 4 3; }
          svg[data-node-ui]:is([data-preset="classic"], [data-preset="signal-flow"], [data-preset="editorial"]) .c-lane { stroke: var(--lane-stroke); stroke-dasharray: none; }
          svg[data-node-ui] [data-graph-role="structural-frame-label-mask"] { rx: 5px; fill: color-mix(in srgb, var(--cloud-stroke) 10%, var(--mask)); stroke: color-mix(in srgb, var(--cloud-stroke) 38%, var(--mask)); stroke-width: .8px; }
          svg[data-node-ui] [data-composition-frame-kind="security-group"] > [data-graph-role="structural-frame-label-mask"] { fill: color-mix(in srgb, var(--security-stroke) 9%, var(--mask)); stroke: color-mix(in srgb, var(--security-stroke) 36%, var(--mask)); }
          svg[data-node-ui] .phase-rule { opacity: .5; stroke-dasharray: none; }
          svg[data-node-ui] .phase-chip { stroke: var(--lane-stroke); stroke-width: .75px; }
          svg[data-node-ui] g[data-edge-from] > rect.c-mask { rx: 7px; stroke: var(--lane-stroke); stroke-width: .75px; }
          svg[data-node-ui][data-preset="blueprint"] :is([data-graph-role="structural-frame-label-mask"], g[data-edge-from] > rect.c-mask, .phase-chip) { rx: 2px; }
          svg[data-node-ui][data-preset="editorial"] :is([data-graph-role="structural-frame-label-mask"], g[data-edge-from] > rect.c-mask, .phase-chip) { rx: 3px; }
        </style>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="0" data-composition-frame-label="Internal" x="18" y="16" width="244" height="118" rx="12" class="c-region" stroke-width="1"/>

        <!-- Connection paths (before components for correct z-order) -->
        <g data-graph-role="automatic-crossover" style="--step:0">
          <path data-graph-role="automatic-crossover-underlay" d="M 240 84 L 320 84" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
          <path data-edge-from="service" data-edge-to="provider" data-edge-label="同步支付请求" data-edge-key="0" data-composition-points="240,84;320,84" data-composition-crossover="halo" data-composition-independent="true" d="M 240 84 L 320 84" class="a-default" data-animate="edge" style="--step:0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        </g>
        <g data-graph-role="automatic-crossover" style="--step:1">
          <path data-graph-role="automatic-crossover-underlay" d="M 320 70 L 240 70" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
          <path data-edge-from="provider" data-edge-to="service" data-edge-label="支付回调" data-edge-key="1" data-composition-points="320,70;240,70" data-composition-crossover="halo" data-composition-independent="true" d="M 320 70 L 240 70" class="a-dashed" data-animate="edge" style="--step:1" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
        </g>

        <!-- Components -->
        <g id="node-service" data-node-id="service" data-node-label="Payment service" tabindex="0" role="button" aria-label="Focus Payment service, Internal" aria-pressed="false" data-node-kind="backend" data-node-context="Internal">
          <title>Payment service · Internal</title>
          <rect x="40" y="40" width="200" height="74" rx="8" class="c-mask"/>
          <rect x="40" y="40" width="200" height="74" rx="8" class="c-backend" data-animate="node" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(46 46) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" x="140" y="81" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Payment service</text>
        </g>

        <g id="node-provider" data-node-id="provider" data-node-label="Provider" tabindex="0" role="button" aria-label="Focus Provider, Architecture component" aria-pressed="false" data-node-kind="external" data-node-context="Architecture component">
          <title>Provider · Architecture component</title>
          <rect x="320" y="40" width="190" height="74" rx="8" class="c-mask"/>
          <rect x="320" y="40" width="190" height="74" rx="8" class="c-external" data-animate="node" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="external" class="semantic-sigil s-external" transform="translate(326 46) scale(0.6875)">
            <rect x="2.5" y="5" width="8.5" height="8" rx="1.5"/>
            <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5"/>
          </g>
          <text data-node-label="" x="415" y="81" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Provider</text>
        </g>

        <!-- Connection labels -->
        <g data-detail="context" data-edge-from="service" data-edge-to="provider" data-edge-label="同步支付请求" data-edge-key="0">
          <rect x="246.2" y="94" width="67.6" height="14" rx="3" class="c-mask"/>
          <text x="280" y="104" class="t-edge-default" font-size="8" text-anchor="middle">同步支付请求</text>
        </g>
        <g data-detail="context" data-edge-from="provider" data-edge-to="service" data-edge-label="支付回调" data-edge-key="1">
          <rect x="255.8" y="50" width="48.4" height="14" rx="3" class="c-mask"/>
          <text x="280" y="60" class="t-edge-dashed" font-size="8" text-anchor="middle">支付回调</text>
        </g>

        <!-- Boundary labels (foreground masks keep routes out of titles) -->
        <g data-graph-role="structural-frame-label" data-composition-frame-id="0" data-composition-frame-kind="region" data-composition-frame-label="Internal">
          <rect data-graph-role="structural-frame-label-mask" x="22" y="20" width="53.199999999999996" height="16" rx="3" class="c-mask"/>
          <text data-boundary-label="" x="26" y="33" class="t-cloud" font-size="9" font-weight="600">Internal</text>
        </g>

        <!-- Legend -->
        <g data-legend="" data-legend-bridge="">
          <text x="40" y="166" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="backend" data-legend-kind="backend" data-legend-label="Backend" data-legend-x="40" data-legend-baseline="186" data-legend-width="87">
            <rect x="40" y="177" width="16" height="10" rx="2.5" class="c-backend" stroke-width="1"/>
            <text x="62" y="186" class="t-muted" font-size="10" font-weight="500">Backend</text>
          </g>
          <g data-legend-semantic-kind="external" data-legend-kind="external" data-legend-label="External" data-legend-x="149" data-legend-baseline="186" data-legend-width="93">
            <rect x="149" y="177" width="16" height="10" rx="2.5" class="c-external" stroke-width="1"/>
            <text x="171" y="186" class="t-muted" font-size="10" font-weight="500">External</text>
          </g>
        </g>
      </svg>