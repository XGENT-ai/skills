          <path data-edge-from="source-2" data-edge-to="hub" data-edge-key="2" data-edge-id="edge-2" data-composition-points="160,354;576,354;576,201;600,201" data-composition-crossover="halo" data-composition-independent="true" d="M 160 354 L 568 354 Q 576 354 576 346 L 576 209 Q 576 201 584 201 L 600 201" class="a-default" data-animate="edge" style="--step:2" stroke-width="4" marker-end="url(#arrowhead)"/>
        </g>

