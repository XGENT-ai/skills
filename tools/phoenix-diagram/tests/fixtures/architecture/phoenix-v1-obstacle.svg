          <text data-node-label="" x="660" y="194" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">b</text>
        </g>

        <g id="node-block" data-node-id="block" data-node-label="block" tabindex="0" role="button" aria-label="Focus block, Architecture component" aria-pressed="false" data-node-kind="backend" data-node-context="Architecture component">
          <title>block · Architecture component</title>
          <rect x="280" y="80" width="200" height="260" rx="8" class="c-mask"/>
          <rect x="280" y="80" width="200" height="260" rx="8" class="c-backend" data-animate="node" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(286 86) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" x="380" y="214" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">block</text>
        </g>

