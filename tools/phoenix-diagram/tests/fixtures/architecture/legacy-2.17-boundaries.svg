<svg viewBox="0 0 590 278" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="standard">
        <title id="archify-diagram-title">Architecture oracle</title>
        <desc id="archify-diagram-description">An architecture diagram generated by Archify.</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="0" data-composition-frame-label="Region" x="70" y="100" width="480" height="110" rx="12" class="c-region" stroke-width="1"/>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="security-group" data-composition-frame-id="1" data-composition-frame-label="Private" x="80" y="108" width="160" height="102" rx="8" class="c-security-group" stroke-width="1"/>

        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="a" data-edge-to="b" data-edge-label="cross" data-edge-key="0" data-composition-points="220,160;400,160" d="M 220 160 L 400 160" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <g id="node-a" data-node-id="a" data-node-label="a" tabindex="0" role="button" aria-label="Focus a, Region › Private" aria-pressed="false" data-node-kind="backend" data-node-context="Region › Private">
          <title>a · Region › Private</title>
          <rect x="100" y="130" width="120" height="60" rx="6" class="c-mask"/>
          <rect x="100" y="130" width="120" height="60" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(106 136) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" x="160" y="164" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">a</text>
        </g>

        <g id="node-b" data-node-id="b" data-node-label="b" tabindex="0" role="button" aria-label="Focus b, Region" aria-pressed="false" data-node-kind="backend" data-node-context="Region">
          <title>b · Region</title>
          <rect x="400" y="130" width="120" height="60" rx="6" class="c-mask"/>
          <rect x="400" y="130" width="120" height="60" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(406 136) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" x="460" y="164" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">b</text>
        </g>

        <!-- Connection labels -->
        <g data-detail="context" data-edge-from="a" data-edge-to="b" data-edge-label="cross" data-edge-key="0">
          <rect x="293" y="140" width="34" height="14" rx="3" class="c-mask"/>
          <text x="310" y="150" class="t-muted" font-size="8" text-anchor="middle">cross</text>
        </g>

        <!-- Boundary labels (foreground masks keep routes out of titles) -->
        <g data-graph-role="structural-frame-label" data-composition-frame-id="0" data-composition-frame-kind="region" data-composition-frame-label="Region">
          <rect data-graph-role="structural-frame-label-mask" x="74" y="92" width="42.4" height="16" rx="3" class="c-mask"/>
          <text data-boundary-label="" x="78" y="105" class="t-cloud" font-size="9" font-weight="600">Region</text>
        </g>

        <g data-graph-role="structural-frame-label" data-composition-frame-id="1" data-composition-frame-kind="security-group" data-composition-frame-label="Private">
          <rect data-graph-role="structural-frame-label-mask" x="84" y="110" width="47.8" height="16" rx="3" class="c-mask"/>
          <text data-boundary-label="" x="88" y="123" class="t-security" font-size="9" font-weight="600">Private</text>
        </g>

        <!-- Legend -->

      </svg>