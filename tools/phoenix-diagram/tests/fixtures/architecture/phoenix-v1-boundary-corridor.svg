<svg viewBox="0 0 382 440" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="classic" data-quality-profile="showcase" data-node-ui="" data-reader-fit="intrinsic-height" data-reader-min-text="7.5" data-reader-primary-text="14">
        <title id="archify-diagram-title">Storage boundary</title>
        <desc id="archify-diagram-description">An architecture diagram generated by Archify.</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>
        <style>
          svg[data-node-ui] [data-node-id] > rect:not(.c-mask) { stroke-width: 1.25px; }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-frontend { fill: color-mix(in srgb, var(--frontend-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--frontend-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-backend { fill: color-mix(in srgb, var(--backend-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--backend-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-database { fill: color-mix(in srgb, var(--database-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--database-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-cloud { fill: color-mix(in srgb, var(--cloud-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--cloud-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-security { fill: color-mix(in srgb, var(--security-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--security-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-messagebus { fill: color-mix(in srgb, var(--messagebus-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--messagebus-stroke) 72%, var(--mask)); }
          :is([data-theme="dark"] svg[data-node-ui], svg[data-node-ui][data-theme="dark"]) [data-node-id] > rect:not(.c-mask).c-external { fill: color-mix(in srgb, var(--external-stroke) 13%, var(--mask)); stroke: color-mix(in srgb, var(--external-stroke) 72%, var(--mask)); }
          svg[data-node-ui]:is([data-preset="classic"], [data-preset="signal-flow"], [data-preset="editorial"]) .c-region { fill: color-mix(in srgb, var(--cloud-stroke) 3%, transparent); stroke: color-mix(in srgb, var(--cloud-stroke) 42%, var(--lane-stroke)); stroke-dasharray: none; }
          svg[data-node-ui] .c-security-group { stroke: color-mix(in srgb, var(--security-stroke) 58%, var(--lane-stroke)); }
          svg[data-node-ui]:is([data-preset="classic"], [data-preset="signal-flow"], [data-preset="editorial"]) .c-security-group { stroke-dasharray: 4 3; }
          svg[data-node-ui]:is([data-preset="classic"], [data-preset="signal-flow"], [data-preset="editorial"]) .c-lane { stroke: var(--lane-stroke); stroke-dasharray: none; }
          svg[data-node-ui] [data-graph-role="structural-frame-label-mask"] { rx: 5px; fill: color-mix(in srgb, var(--cloud-stroke) 10%, var(--mask)); stroke: color-mix(in srgb, var(--cloud-stroke) 38%, var(--mask)); stroke-width: .8px; }
          svg[data-node-ui] [data-composition-frame-kind="security-group"] > [data-graph-role="structural-frame-label-mask"] { fill: color-mix(in srgb, var(--security-stroke) 9%, var(--mask)); stroke: color-mix(in srgb, var(--security-stroke) 36%, var(--mask)); }
          svg[data-node-ui] .phase-rule { opacity: .5; stroke-dasharray: none; }
          svg[data-node-ui] .phase-chip { stroke: var(--lane-stroke); stroke-width: .75px; }
          svg[data-node-ui] g[data-edge-from] > rect.c-mask { rx: 7px; stroke: var(--lane-stroke); stroke-width: .75px; }
          svg[data-node-ui][data-preset="blueprint"] :is([data-graph-role="structural-frame-label-mask"], g[data-edge-from] > rect.c-mask, .phase-chip) { rx: 2px; }
          svg[data-node-ui][data-preset="editorial"] :is([data-graph-role="structural-frame-label-mask"], g[data-edge-from] > rect.c-mask, .phase-chip) { rx: 3px; }
        </style>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="region" data-composition-frame-id="0" data-composition-frame-label="Stored data" x="76" y="256" width="228" height="116" rx="12" class="c-region" stroke-width="1"/>

        <!-- Connection paths (before components for correct z-order) -->
        <g data-graph-role="automatic-crossover" style="--step:0">
          <path data-graph-role="automatic-crossover-underlay" d="M 280 116 L 312 116 Q 320 116 320 124 L 320 308 Q 320 316 312 316 L 280 316" fill="none" stroke="var(--mask)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
          <path data-edge-from="producer" data-edge-to="store" data-edge-label="Persist" data-edge-key="0" data-composition-points="280,116;320,116;320,316;280,316" data-composition-crossover="halo" data-composition-independent="true" d="M 280 116 L 312 116 Q 320 116 320 124 L 320 308 Q 320 316 312 316 L 280 316" class="a-default" data-animate="edge" style="--step:0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        </g>

        <!-- Components -->
        <g id="node-producer" data-node-id="producer" data-node-label="Producer" tabindex="0" role="button" aria-label="Focus Producer, Architecture component" aria-pressed="false" data-node-kind="backend" data-node-context="Architecture component">
          <title>Producer · Architecture component</title>
          <rect x="100" y="80" width="180" height="72" rx="8" class="c-mask"/>
          <rect x="100" y="80" width="180" height="72" rx="8" class="c-backend" data-animate="node" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(106 86) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" x="190" y="120" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Producer</text>
        </g>

        <g id="node-store" data-node-id="store" data-node-label="Storage" tabindex="0" role="button" aria-label="Focus Storage, Stored data" aria-pressed="false" data-node-kind="database" data-node-context="Stored data">
          <title>Storage · Stored data</title>
          <rect x="100" y="280" width="180" height="72" rx="8" class="c-mask"/>
          <rect x="100" y="280" width="180" height="72" rx="8" class="c-database" data-animate="node" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(106 286) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-node-label="" x="190" y="320" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Storage</text>
        </g>

        <!-- Connection labels -->
        <g data-detail="context" data-edge-from="producer" data-edge-to="store" data-edge-label="Persist" data-edge-key="0">
          <rect x="298.2" y="196" width="43.6" height="14" rx="3" class="c-mask"/>
          <text x="320" y="206" class="t-edge-default" font-size="8" text-anchor="middle">Persist</text>
        </g>

        <!-- Boundary labels (foreground masks keep routes out of titles) -->
        <g data-graph-role="structural-frame-label" data-composition-frame-id="0" data-composition-frame-kind="region" data-composition-frame-label="Stored data">
          <rect data-graph-role="structural-frame-label-mask" x="80" y="260" width="69.4" height="16" rx="3" class="c-mask"/>
          <text data-boundary-label="" x="84" y="273" class="t-cloud" font-size="9" font-weight="600">Stored data</text>
        </g>

        <!-- Legend -->
        <g data-legend="" data-legend-bridge="">
          <text x="40" y="404" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="backend" data-legend-kind="backend" data-legend-label="Backend" data-legend-x="40" data-legend-baseline="424" data-legend-width="87">
            <rect x="40" y="415" width="16" height="10" rx="2.5" class="c-backend" stroke-width="1"/>
            <text x="62" y="424" class="t-muted" font-size="10" font-weight="500">Backend</text>
          </g>
          <g data-legend-semantic-kind="database" data-legend-kind="database" data-legend-label="Database" data-legend-x="149" data-legend-baseline="424" data-legend-width="93">
            <rect x="149" y="415" width="16" height="10" rx="2.5" class="c-database" stroke-width="1"/>
            <text x="171" y="424" class="t-muted" font-size="10" font-weight="500">Database</text>
          </g>
        </g>
      </svg>