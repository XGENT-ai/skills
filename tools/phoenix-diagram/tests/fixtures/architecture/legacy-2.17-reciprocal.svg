<svg viewBox="0 0 680 268" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="standard">
        <title id="archify-diagram-title">Architecture oracle</title>
        <desc id="archify-diagram-description">An architecture diagram generated by Archify.</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->


        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="runtime" data-edge-to="agents" data-edge-label="spawn" data-edge-key="0" data-edge-id="spawn" data-composition-points="240,167;440,167" d="M 240 167 L 440 167" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="agents" data-edge-to="runtime" data-edge-label="report" data-edge-key="1" data-edge-id="report" data-composition-points="440,153;240,153" d="M 440 153 L 240 153" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <g id="node-runtime" data-node-id="runtime" data-node-label="runtime" tabindex="0" role="button" aria-label="Focus runtime, Architecture component" aria-pressed="false" data-node-kind="backend" data-node-context="Architecture component">
          <title>runtime · Architecture component</title>
          <rect x="40" y="120" width="200" height="80" rx="6" class="c-mask"/>
          <rect x="40" y="120" width="200" height="80" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(46 126) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" x="140" y="164" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">runtime</text>
        </g>

        <g id="node-agents" data-node-id="agents" data-node-label="agents" tabindex="0" role="button" aria-label="Focus agents, Architecture component" aria-pressed="false" data-node-kind="backend" data-node-context="Architecture component">
          <title>agents · Architecture component</title>
          <rect x="440" y="120" width="200" height="80" rx="6" class="c-mask"/>
          <rect x="440" y="120" width="200" height="80" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(446 126) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" x="540" y="164" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">agents</text>
        </g>

        <!-- Connection labels -->
        <g data-detail="context" data-edge-from="runtime" data-edge-to="agents" data-edge-label="spawn" data-edge-key="0" data-edge-id="spawn">
          <rect x="323" y="147" width="34" height="14" rx="3" class="c-mask"/>
          <text x="340" y="157" class="t-muted" font-size="8" text-anchor="middle">spawn</text>
        </g>
        <g data-detail="context" data-edge-from="agents" data-edge-to="runtime" data-edge-label="report" data-edge-key="1" data-edge-id="report">
          <rect x="320.6" y="133" width="38.8" height="14" rx="3" class="c-mask"/>
          <text x="340" y="143" class="t-muted" font-size="8" text-anchor="middle">report</text>
        </g>

        <!-- Boundary labels (foreground masks keep routes out of titles) -->


        <!-- Legend -->

      </svg>