        <path data-edge-from="b" data-edge-to="c" data-edge-key="1" data-composition-points="500,160;500,230;545,230;545,300" d="M 500 160 L 500 222 Q 500 230 508 230 L 537 230 Q 545 230 545 238 L 545 300" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

