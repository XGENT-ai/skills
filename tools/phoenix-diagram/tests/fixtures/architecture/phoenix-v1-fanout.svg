          <text data-node-label="" x="400" y="104" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">hub</text>
        </g>

        <g id="node-west" data-node-id="west" data-node-label="west" tabindex="0" role="button" aria-label="Focus west, Architecture component" aria-pressed="false" data-node-kind="backend" data-node-context="Architecture component">
          <title>west · Architecture component</title>
