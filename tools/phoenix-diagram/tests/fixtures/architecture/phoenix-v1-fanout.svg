        </g>

        <g id="node-middle" data-node-id="middle" data-node-label="middle" tabindex="0" role="button" aria-label="Focus middle, Architecture component" aria-pressed="false" data-node-kind="backend" data-node-context="Architecture component">
          <title>middle · Architecture component</title>
          <rect x="310" y="300" width="180" height="80" rx="8" class="c-mask"/>
