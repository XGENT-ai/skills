          <path data-edge-from="a" data-edge-to="b" data-edge-label="start" data-edge-key="0" data-edge-id="ab" data-composition-points="196,60;268,60" data-composition-crossover="halo" data-composition-independent="true" d="M 196 60 L 268 60" class="a-emphasis" data-animate="edge" style="--step:0" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        </g>
