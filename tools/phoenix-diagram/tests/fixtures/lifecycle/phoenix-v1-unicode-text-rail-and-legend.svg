          <path data-edge-from="b" data-edge-to="c" data-edge-label="finish" data-edge-key="1" data-edge-id="bc" data-composition-points="413,60;487,60" data-composition-crossover="halo" data-composition-independent="true" d="M 413 60 L 487 60" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
