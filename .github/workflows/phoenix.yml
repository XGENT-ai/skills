name: Phoenix

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build both tools and run smoke checks; skip regression suites
        type: boolean
        default: false
  push:
    paths: &phoenix_paths
      - '.github/workflows/phoenix.yml'
      - 'mise.toml'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'LICENSE'
      - 'bin/**'
      - 'scripts/*phoenix*.mjs'
      - 'scripts/install.js'
      - 'scripts/run-tests.mjs'
      - 'tools/phoenix-ui/**'
      - 'tools/phoenix-diagram/**'
      - 'skills/phoenix-ui/**'
      - 'skills/phoenix-diagram/**'
      - 'dist/phoenix-ui/**'
      - 'dist/phoenix-diagram/**'
      - 'docs/phoenix-ui.md'
      - 'docs/phoenix-diagram.md'
      - 'test/**'
  pull_request:
    paths: *phoenix_paths

permissions:
  contents: read
  actions: read

concurrency:
  group: phoenix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-native:
    name: UI Native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
        working-directory: tools/phoenix-ui
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      PHOENIX_UI_BUILD_TARGET: ${{ matrix.rust-target }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Preserve exact lock and source bytes on Windows without modifying git's
      # global configuration. Applies to checkout and the RustSec clone.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25.2.1'
          package-manager-cache: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.9.12'
          working_directory: tools/phoenix-ui
          install: false
          cache: false
          add_shims_to_path: false
          env: false
          export_path: false
          persist_github_token: false
      - name: Explicit online preparation
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../../scripts/prepare-phoenix-ui.mjs --prepare
      - name: Permit the pinned Chromium sandbox on Linux ARM
        if: matrix.platform == 'linux-arm64'
        run: |
          test -x "$PHOENIX_UI_BROWSER"
          profile="$RUNNER_TEMP/phoenix-ui-chromium.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile phoenix-ui-chromium "$PHOENIX_UI_BROWSER" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --replace "$profile"
      - name: Audit prepared dependencies offline
        id: audit
        env:
          CARGO_NET_OFFLINE: 'true'
        run: mise exec --no-deps -- node ../../scripts/check-phoenix-deps.mjs --write
      # Check committed evidence before platform builds replace VERSION/ENGINE.
      - name: Lightweight repository tests
        if: ${{ !inputs.build_only }}
        id: light
        env:
          CARGO_NET_OFFLINE: 'true'
        run: mise exec --no-deps -- npm --prefix ../.. test
      - name: Build native and WASM from the prepared cache
        id: build
        env:
          CARGO_NET_OFFLINE: 'true'
        run: mise exec --no-deps -- node ../../scripts/build-phoenix-ui.mjs --development --output-dir ../../local/phoenix-ui/ci-release/${{ matrix.platform }}
      - name: Native and portable Node runtime smoke
        id: smoke
        env:
          CARGO_NET_OFFLINE: 'true'
        run: mise exec --no-deps -- node ../../scripts/smoke-phoenix-ui.mjs --release-dir ../../local/phoenix-ui/ci-release/${{ matrix.platform }} --target ${{ matrix.platform }} --stage-runtime
      - name: Full Phoenix runtime tests offline
        if: ${{ !inputs.build_only }}
        id: runtime
        env:
          CARGO_NET_OFFLINE: 'true'
        run: mise exec --no-deps -- npm --prefix ../.. run test:phoenix
      - name: Record actual phase outcomes
        if: always()
        env:
          PHOENIX_PREPARE_RESULT: ${{ steps.prepare.outcome }}
          PHOENIX_AUDIT_RESULT: ${{ steps.audit.outcome }}
          PHOENIX_BUILD_RESULT: ${{ steps.build.outcome }}
          PHOENIX_SMOKE_RESULT: ${{ steps.smoke.outcome }}
          PHOENIX_LIGHT_RESULT: ${{ steps.light.outcome }}
          PHOENIX_RUNTIME_RESULT: ${{ steps.runtime.outcome }}
          PHOENIX_TARGET: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const phases = Object.fromEntries(['prepare', 'audit', 'build', 'smoke', 'light', 'runtime'].map(name => [name, process.env[`PHOENIX_${name.toUpperCase()}_RESULT`]]));
          const record = {schemaVersion: 1, workflowRun: process.env.GITHUB_RUN_ID, sourceCommit: process.env.GITHUB_SHA, target: process.env.PHOENIX_TARGET, phases, browserAcceptance: 'not-run', providerSessionAcceptance: 'not-run', distribution: 'development', publication: 'not-requested'};
          fs.mkdirSync('../../local/phoenix-ui/ci-prepare', {recursive: true});
          fs.writeFileSync(`../../local/phoenix-ui/ci-prepare/${record.target}-ci-results.json`, JSON.stringify(record, null, 2) + '\n');
          NODE
      - name: Upload development artifact and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-ui-${{ matrix.platform }}
          path: local/phoenix-ui/ci-release/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Upload preparation and phase evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-ui-${{ matrix.platform }}-evidence
          path: local/phoenix-ui/ci-prepare/
          if-no-files-found: error
          retention-days: 14

  ui-node18-consumer:
    name: UI Node 18 portable consumer smoke
    needs: ui-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Consumption floor only; maintenance still uses locked Node 25.2.1.
          node-version: '18.20.8'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phoenix-ui-linux-x64
          path: local/phoenix-ui/node18-consumer
      - name: Run portable local installation and runtime on Node 18
        run: node scripts/smoke-phoenix-ui.mjs --release-dir local/phoenix-ui/node18-consumer --target linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phoenix-ui-node18-consumer-evidence
          path: local/phoenix-ui/node18-consumer/runtime-smoke-node18.json
          if-no-files-found: warn
          retention-days: 14

  native:
    name: Diagram Native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
      CARGO_NET_OFFLINE: 'true'
      RUST_TEST_THREADS: '4'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PHOENIX_DIAGRAM_BUILD_TARGET: ${{ matrix.rust-target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25.2.1'
          package-manager-cache: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.9.12'
          working_directory: tools/phoenix-diagram
          install: false
          cache: false
          add_shims_to_path: false
          env: false
          export_path: false
          persist_github_token: false
      - name: Require the exact clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Explicit online native and browser preparation
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-phoenix-diagram.mjs --prepare
      - name: Permit the pinned Chromium sandbox on Linux ARM
        if: matrix.platform == 'linux-arm64'
        run: |
          test -x "$PHOENIX_DIAGRAM_BROWSER"
          profile="$RUNNER_TEMP/phoenix-diagram-chromium.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile phoenix-diagram-chromium "$PHOENIX_DIAGRAM_BROWSER" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --replace "$profile"
      - name: Verify prepared sources and tools offline
        id: source
        run: mise exec --no-deps -- node scripts/check-phoenix-diagram-source.mjs --check
      - name: Build and probe this native host offline
        id: build
        run: mise exec --no-deps -- node scripts/build-phoenix-diagram.mjs --development --output-dir local/phoenix-diagram/ci-release/${{ matrix.platform }}
      - name: Run native Diagram tests offline
        if: ${{ !inputs.build_only }}
        id: native
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: '2'
          CARGO_PROFILE_TEST_OPT_LEVEL: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
        run: mise exec --no-deps -- mbx test --manifest-path tools/phoenix-diagram/Cargo.toml --locked --offline
      - name: Upload development artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-diagram-${{ matrix.platform }}
          path: local/phoenix-diagram/ci-release/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
      - name: Record actual native phase and artifact outcomes
        if: always()
        env:
          PHOENIX_TARGET: ${{ matrix.platform }}
          PHOENIX_PREPARE_RESULT: ${{ steps.prepare.outcome }}
          PHOENIX_SOURCE_RESULT: ${{ steps.source.outcome }}
          PHOENIX_BUILD_RESULT: ${{ steps.build.outcome }}
          PHOENIX_NATIVE_RESULT: ${{ steps.native.outcome }}
          PHOENIX_UPLOAD_RESULT: ${{ steps.upload.outcome }}
          PHOENIX_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PHOENIX_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PHOENIX_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const phases = Object.fromEntries(['prepare','source','build','native','upload'].map(name => [name, process.env[`PHOENIX_${name.toUpperCase()}_RESULT`] || 'not-run']));
          const record = {schemaVersion:1, tool:'phoenix-diagram', workflowRun:process.env.GITHUB_RUN_ID, sourceCommit:process.env.GITHUB_SHA, target:process.env.PHOENIX_TARGET, phases, upload:{id:process.env.PHOENIX_ARTIFACT_ID,url:process.env.PHOENIX_ARTIFACT_URL,digest:process.env.PHOENIX_ARTIFACT_DIGEST}, browserAcceptance:'not-run', visualReview: 'required-pending', providerSessionAcceptance: 'not-run', publication:'not-requested'};
          const testEnginePath = 'tools/phoenix-diagram/target/debug/phoenix-diagram';
          const testEngineStat = fs.existsSync(testEnginePath) ? fs.statSync(testEnginePath) : null;
          record.nativeTestEngine = testEngineStat ? {path:testEnginePath, bytes:testEngineStat.size, links:testEngineStat.nlink, scope:'Compiler output size diagnostic only'} : null;
          fs.mkdirSync('local/phoenix-diagram/ci-prepare', {recursive:true});
          fs.writeFileSync(`local/phoenix-diagram/ci-prepare/${record.target}-ci-results.json`, JSON.stringify(record,null,2)+'\n');
          NODE
      - name: Upload independent preparation and phase evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-diagram-${{ matrix.platform }}-evidence
          path: local/phoenix-diagram/ci-prepare/
          if-no-files-found: error
          retention-days: 14
