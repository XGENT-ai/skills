[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xgent-evolve"
version = "0.1.0"
description = "Deterministic controller for isolated remote instruction experiments"
requires-python = ">=3.12"
dependencies = ["harbor==0.24.0"]

[project.scripts]
xgent-evolve = "evolution:main"

[tool.setuptools]
py-modules = ["evolution", "protocol", "compare", "remote", "quality", "typesafe_worker"]
