interface:
  display_name: "代码变更评审"
  short_description: "审查开发计划登记的提交、未提交、commit、范围或分支差异，核对计划完成闭环并给出验收判定"
  default_prompt: "使用 $review-code 审查指定开发计划登记的提交与未提交改动，或指定的代码变更，按 P0–P3 输出有证据的问题，能自行取得的证据在本轮补齐；计划模式核对全部里程碑、退出条件与最终提交，未完成时不给整体验收。将完整报告落盘并回读核验；回复验收判定、报告链接，以及计划续做、apply-code-review 或差异核查的下一步命令。"
policy:
  allow_implicit_invocation: false
