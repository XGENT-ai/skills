interface:
  display_name: "UI/UX 验收评审"
  short_description: "真实界面增量取证，同状态共用截图，由独立评审判定验收并列出差距"
  default_prompt: "使用 $review-ui 对指定界面做独立 UI/UX 验收。读取目标包、报告和修复历史，按影响范围先实测再采集必要代表帧；同状态多问题共用一图，复用有效历史及 apply 材料。默认一位全新上下文评审变化和未关闭项，继承未受影响的已通过结论，不按分差自动追加评审。保存并回读原文、证据清单和报告，给出判定及下一步命令；有可执行补证交 apply-ui-review，只缺独立评审则继续当前轮；条件未变不空跑新轮。"
policy:
  allow_implicit_invocation: false
