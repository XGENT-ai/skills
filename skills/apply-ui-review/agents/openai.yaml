interface:
  display_name: "落实 UI 验收评审"
  short_description: "执行 UI 验收报告中的修复、补证与解阻，实拍自检，记录后交回独立复审"
  default_prompt: "使用 $apply-ui-review 按报告执行修复、补证与解阻。按页面状态分组核实，多问题共用一图，优先处理阻断项与共同根因；停滞先诊断，仅结构性根因才重构。按影响范围自检，记录版本、条件和可复用材料；只把实际改过的差距记为已修改待评审，不自行评分。按已有约定提交并保存处置；完成后交 review-ui 独立复审，条件未变且无新证据不空跑。"
policy:
  allow_implicit_invocation: false
