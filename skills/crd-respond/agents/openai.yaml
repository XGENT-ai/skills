interface:
  display_name: "CRD 接收方评估与答复"
  short_description: "接收方评估跨项目需求与长期方案，在原 CRD 文末答复或续接澄清；需改本方代码时生成计划"
  default_prompt: "使用 $crd-respond 代表 CRD 接收方处理完整文档；若实际是提出方则交回 crd，不因收到文件或追加回复而切换角色。评估时核实本方最新工作树，分别判断目标和指定方案，以可持续性、通用性、精心设计及实际约束比较长期备选，在原文末追加有证据且保留历史的答复；需改本方代码时实际调用 dev-plan 生成并核验计划，未决契约标 Blocked。仅原样追加本方已拟答复或收录提出方澄清时保留来源与原意，不重评或生成计划。仅评估/仅答复遵守边界，不实施，不发送。"
